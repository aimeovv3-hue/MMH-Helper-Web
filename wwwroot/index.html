<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMH Atmos Helper Web</title>
    <base href="/MMH-Helper-Web/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body style="background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <div id="app" style="text-align: center; margin-top: 20%; font-size: 1.2em; color: #00d2ff; padding: 20px;">
        <div>⚡ Cargando motor MMH Atmos Helper...</div>
        <div id="blazor-error-log" style="text-align: left; margin-top: 15px; font-family: monospace; font-size: 0.85em;"></div>
    </div>

    <script>
        // Capturar errores no manejados de JS o red y mostrarlos en pantalla
        window.addEventListener('error', function (e) {
            var log = document.getElementById('blazor-error-log');
            if (log) {
                log.innerHTML += '<div style="color:#ff5555; background:#220000; padding:10px; margin-top:8px; border-radius:4px; border:1px solid #ff0000;">❌ Error: ' + e.message + ' (en ' + e.filename + ')</div>';
            }
        });
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // Iniciar Blazor manualmente omitiendo bloqueo de hashes
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                return defaultUri;
            }
        }).catch(function (err) {
            var log = document.getElementById('blazor-error-log');
            if (log) {
                log.innerHTML += '<div style="color:#ff5555; background:#220000; padding:10px; margin-top:8px; border-radius:4px; border:1px solid #ff0000;">❌ Error de inicio de Blazor: ' + err + '</div>';
            }
        });
    </script>
    <script src="js/audioDownloader.js"></script>
</body>
</html>
