<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Prime | Catálogo Oficial</title>
    <style>
        :root {
            --primary: #00e676; 
            --bg-dark: #0a0a0a;
            --card-bg: #141414;
            --text-main: #ffffff;
            --text-sec: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 50px; }
        
        header { text-align: center; padding: 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .logo { font-size: 1.8em; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--primary); }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        
        /* Tarjeta de Producto Premium */
        .product-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Contenedor de Imagen Principal */
        .img-container { width: 100%; aspect-ratio: 4/5; background-color: #222; position: relative; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        .badge { position: absolute; top: 15px; left: 15px; background: var(--primary); color: #000; padding: 5px 12px; font-size: 0.8em; font-weight: bold; border-radius: 20px; text-transform: uppercase; }
        
        .product-info { padding: 20px; }
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .product-title { font-size: 1.4em; font-weight: bold; }
        .product-price { font-size: 1.3em; color: var(--primary); font-weight: bold; }
        
        .section-label { font-size: 0.9em; color: var(--text-sec); margin: 15px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Selectores de Color (Fotos miniatura) */
        .color-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .color-btn { width: 50px; height: 50px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; overflow: hidden; transition: 0.2s; background-color: #333; }
        .color-btn img { width: 100%; height: 100%; object-fit: cover; }
        .color-btn.active { border-color: var(--primary); transform: scale(1.05); }
        
        /* Selectores de Talla (Botones) */
        .size-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .size-btn { flex: 1; padding: 12px; background: transparent; border: 1px solid #444; color: white; border-radius: 8px; font-size: 1em; cursor: pointer; transition: 0.2s; }
        .size-btn.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
        
        /* Botón Comprar */
        .btn-whatsapp { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 16px; background-color: #25d366; color: #000; font-size: 1.1em; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 20px; text-transform: uppercase; transition: transform 0.1s; }
        .btn-whatsapp:active { transform: scale(0.98); }
        .btn-whatsapp svg { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>
<body>

    <header>
        <div class="logo">Peak <span>Prime</span></div>
    </header>

    <div class="container">
        
        <!-- PRODUCTO 1 -->
        <div class="product-card" id="producto-1">
            <div class="img-container">
                <div class="badge">Nuevo</div>
                <!-- Esta es la imagen grande principal -->
                <img id="main-img-1" src="https://via.placeholder.com/600x750/222222/ffffff?text=FOTO+DEL+CONJUNTO" alt="Conjunto Deportivo">
            </div>
            
            <div class="product-info">
                <div class="title-row">
                    <div class="product-title">Conjunto Apex Runner</div>
                    <div class="product-price">S/. 135.00</div>
                </div>

                <div class="section-label">1. Selecciona el Color: <span id="color-name-1" style="color: white;">Negro</span></div>
                <div class="color-selector">
                    <!-- Miniatura 1 (Color por defecto) -->
                    <div class="color-btn active" onclick="cambiarColor(1, 'Negro', 'https://via.placeholder.com/600x750/111111/ffffff?text=FOTO+NEGRO', this)">
                        <img src="https://via.placeholder.com/100/111111/ffffff?text=N">
                    </div>
                    <!-- Miniatura 2 -->
                    <div class="color-btn" onclick="cambiarColor(1, 'Verde Neón', 'https://via.placeholder.com/600x750/00e676/000000?text=FOTO+VERDE', this)">
                        <img src="https://via.placeholder.com/100/00e676/000000?text=V">
                    </div>
                    <!-- Miniatura 3 -->
                    <div class="color-btn" onclick="cambiarColor(1, 'Gris Carbón', 'https://via.placeholder.com/600x750/555555/ffffff?text=FOTO+GRIS', this)">
                        <img src="https://via.placeholder.com/100/555555/ffffff?text=G">
                    </div>
                </div>

                <div class="section-label">2. Selecciona la Talla:</div>
                <div class="size-selector">
                    <button class="size-btn" onclick="seleccionarTalla(1, 'S', this)">S</button>
                    <button class="size-btn active" onclick="seleccionarTalla(1, 'M', this)">M</button>
                    <button class="size-btn" onclick="seleccionarTalla(1, 'L', this)">L</button>
                </div>

                <button class="btn-whatsapp" onclick="enviarWhatsApp(1, 'Conjunto Apex Runner', '135.00')">
                    <svg viewBox="0 0 24 24"><path d="M12.031 21.418c-1.547 0-3.053-.399-4.398-1.155l-4.887 1.258 1.306-4.708a9.882 9.882 0 0 1-1.29-4.896c0-5.464 4.444-9.907 9.908-9.907 2.648 0 5.138 1.031 7.01 2.903a9.873 9.873 0 0 1 2.903 7.005c-.001 5.463-4.445 9.9-9.908 9.9zM7.227 18.232c1.439.827 3.125 1.264 4.805 1.264 4.401 0 7.985-3.583 7.985-7.984 0-4.4-3.584-7.985-7.985-7.985-4.4 0-7.984 3.584-7.984 7.985 0 1.636.417 3.208 1.21 4.593l-.865 3.12 3.189-.838.645.38.001-.001zM17.156 14.86c-.234-.117-1.385-.683-1.599-.762-.213-.078-.37-.117-.525.117-.156.234-.602.762-.738.918-.135.156-.271.176-.505.059-.234-.117-1-.369-1.902-1.172-.703-.625-1.178-1.396-1.314-1.63-.135-.234-.014-.361.103-.478.106-.106.234-.273.351-.41.117-.137.156-.234.234-.391.078-.156.039-.293-.02-.41-.059-.117-.525-1.27-.718-1.738-.19-.459-.383-.396-.525-.402-.135-.008-.291-.008-.447-.008-.156 0-.41.059-.625.293-.215.234-.82.801-.82 1.953s.84 2.266.957 2.422c.117.156 1.652 2.52 4 3.48.558.228 1.058.406 1.488.544.59.187 1.127.16 1.55.098.473-.07 1.385-.566 1.58-1.113.195-.547.195-1.016.137-1.113-.059-.098-.215-.156-.449-.274z"/></svg>
                    Lo quiero
                </button>
            </div>
        </div>

    </div>

    <script>
        // Memoria para guardar la selección del usuario
        const selecciones = {
            1: { color: 'Negro', talla: 'M' } // Valores por defecto del Producto 1
        };

        // Función para cambiar la imagen grande y guardar el color elegido
        function cambiarColor(idProducto, nombreColor, urlImagen, elemento) {
            // Actualizar imagen grande
            document.getElementById('main-img-' + idProducto).src = urlImagen;
            // Actualizar texto del color
            document.getElementById('color-name-' + idProducto).innerText = nombreColor;
            
            // Cambiar el borde activo en los botones de color
            let botones = elemento.parentElement.getElementsByClassName('color-btn');
            for(let btn of botones) { btn.classList.remove('active'); }
            elemento.classList.add('active');

            // Guardar selección
            selecciones[idProducto].color = nombreColor;
        }

        // Función para seleccionar la talla visualmente
        function seleccionarTalla(idProducto, talla, elemento) {
            // Cambiar color del botón de talla
            let botones = elemento.parentElement.getElementsByClassName('size-btn');
            for(let btn of botones) { btn.classList.remove('active'); }
            elemento.classList.add('active');

            // Guardar selección
            selecciones[idProducto].talla = talla;
        }

        // Función que arma y envía el mensaje a WhatsApp
        function enviarWhatsApp(idProducto, nombreProducto, precio) {
            const numeroEmpresa = "51957716405";
            const colorElegido = selecciones[idProducto].color;
            const tallaElegida = selecciones[idProducto].talla;

            // EL MENSAJE EXACTO QUE PEDISTE
            const mensaje = "Hola, me interesa este conjunto " + nombreProducto + " con su información:\n\n" +
                            "🔸 *Color:* " + colorElegido + "\n" +
                            "🔸 *Talla:* " + tallaElegida + "\n" +
                            "🔸 *Precio web:* S/. " + precio + "\n" +
                            "🔸 *Mis medidas son:* (Escribe tus medidas aquí o avísame para ayudarte a elegir)\n\n" +
                            "¿Me confirmas disponibilidad para coordinar el envío?";

            const url = "https://api.whatsapp.com/send?phone=" + numeroEmpresa + "&text=" + encodeURIComponent(mensaje);
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
