<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Prime | Conjuntos Deportivos y de Invierno</title>
    <style>
        :root {
            --primary-color: #00e676; /* Verde neón deportivo */
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-light); }
        header { background-color: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--primary-color); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8em; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .logo span { color: var(--primary-color); }
        .banner { background-color: var(--primary-color); color: #000; padding: 10px; text-align: center; font-size: 0.9em; font-weight: bold; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section-title { font-size: 1.4em; margin: 30px 0 15px 0; border-left: 4px solid var(--primary-color); padding-left: 10px; text-transform: uppercase; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .card-title { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .card-price { color: var(--primary-color); font-size: 1.5em; font-weight: bold; margin: 10px 0; }
        .tag-envio { background-color: rgba(0, 230, 118, 0.1); color: var(--primary-color); padding: 5px 10px; font-size: 0.8em; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid var(--primary-color); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9em; color: var(--text-muted); margin-bottom: 5px; }
        select { width: 100%; padding: 12px; background-color: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; font-size: 1em; outline: none; }
        select:focus { border-color: var(--primary-color); }
        .btn-buy { background-color: #25d366; color: #000; border: none; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; }
        .btn-buy:hover { background-color: #1ebd58; color: white; }
        footer { text-align: center; padding: 30px; font-size: 0.8em; color: var(--text-muted); background-color: #000; border-top: 1px solid #333; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Peak <span>Prime</span></div>
    </header>

    <div class="banner">
        🔥 Catálogo Exclusivo Perú | Consulta por interno tu descuento especial 🔥
    </div>

    <div class="container">
        <div class="section-title">Deportivo High Performance</div>
        
        <div class="card">
            <div class="card-title">Conjunto Apex Runner</div>
            <div class="tag-envio">Envíos por Olva y Shalom</div>
            <div class="card-price">S/. 135.00</div>
            
            <div class="form-group">
                <label>Talla:</label>
                <select id="talla-p1">
                    <option value="S">S (Small)</option>
                    <option value="M">M (Medium)</option>
                    <option value="L">L (Large)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Agencia de Envío:</label>
                <select id="envio-p1">
                    <option value="Olva Courier">Olva Courier (Domicilio)</option>
                    <option value="Shalom">Shalom (Recojo en Agencia)</option>
                </select>
            </div>

            <button class="btn-buy" onclick="enviarPedido('Conjunto Apex Runner', '135.00', 'talla-p1', 'envio-p1')">
                Consultar en WhatsApp
            </button>
        </div>

        <div class="section-title">Invierno Premium</div>

        <div class="card">
            <div class="card-title">Conjunto Térmico Summit</div>
            <div class="tag-envio">Envíos por Olva y Shalom</div>
            <div class="card-price">S/. 195.00</div>
            
            <div class="form-group">
                <label>Talla:</label>
                <select id="talla-p2">
                    <option value="M">M (Medium)</option>
                    <option value="L">L (Large)</option>
                    <option value="XL">XL (Extra Large)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Agencia de Envío:</label>
                <select id="envio-p2">
                    <option value="Olva Courier">Olva Courier (Domicilio)</option>
                    <option value="Shalom">Shalom (Recojo en Agencia)</option>
                </select>
            </div>

            <button class="btn-buy" onclick="enviarPedido('Conjunto Térmico Summit', '195.00', 'talla-p2', 'envio-p2')">
                Consultar en WhatsApp
            </button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Peak Prime. Todos los derechos reservados.</p>
    </footer>

    <script>
        function enviarPedido(producto, precio, idTalla, idEnvio) {
            // Número oficial de Peak Prime actualizado con el prefijo de Perú
            var numeroTelefono = "51957716405"; 
            
            var talla = document.getElementById(idTalla).value;
            var envio = document.getElementById(idEnvio).value;
            
            var mensaje = "¡Hola Peak Prime! 🏔️ Estoy en la web y quiero consultar mi descuento para:\n\n" +
                          "🔹 *Producto:* " + producto + "\n" +
                          "📏 *Talla:* " + talla + "\n" +
                          "💵 *Precio Web:* S/. " + precio + "\n" +
                          "📦 *Envío por:* " + envio + "\n\n" +
                          "¿Cómo procedemos con la compra?";
            
            var urlWhatsApp = "https://api.whatsapp.com/send?phone=" + numeroTelefono + "&text=" + encodeURIComponent(mensaje);
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
